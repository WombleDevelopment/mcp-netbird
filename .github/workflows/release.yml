name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  goreleaser:
    name: Binaries, archives and .deb packages
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Container images
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # build provenance attestations
      attestations: write
    env:
      # Docker Hub is optional. Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
      # repository secrets to publish there as well; without them this workflow
      # publishes to GHCR only, which needs no configuration.
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine target registries
        id: registries
        run: |
          # Registry namespaces must be lowercase; the GitHub owner may not be.
          ghcr="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/mcp-netbird"
          {
            echo 'images<<IMAGES_EOF'
            echo "$ghcr"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/$DOCKERHUB_USERNAME/mcp-netbird"
            fi
            echo 'IMAGES_EOF'
            echo "ghcr=$ghcr"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing to: $ghcr${DOCKERHUB_USERNAME:+ and Docker Hub}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record build timestamp
        id: build
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # ---- stdio image (default: MCP clients that launch a subprocess) ----

      - name: Metadata (stdio)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push stdio image
        id: build-stdio
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ---- SSE image (long-running HTTP server), tagged with a -sse suffix ----

      - name: Metadata (SSE)
        id: meta-sse
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.registries.outputs.images }}
          flavor: |
            suffix=-sse,onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push SSE image
        id: build-sse
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.sse
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-sse.outputs.tags }}
          labels: ${{ steps.meta-sse.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest stdio image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.registries.outputs.ghcr }}
          subject-digest: ${{ steps.build-stdio.outputs.digest }}
          push-to-registry: true

      - name: Attest SSE image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.registries.outputs.ghcr }}
          subject-digest: ${{ steps.build-sse.outputs.digest }}
          push-to-registry: true

      - name: Update Docker Hub repository description
        if: env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/mcp-netbird
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md
